  saved.sort((a,b)=>b.createdAt-a.createdAt);data.saved=saved;
  const p=S.me;
  const d=[p.college,p.branch,p.semester&&('Semester '+p.semester)].filter(Boolean).join(' · ');
  const tabs=[['notes','Notes'],['videos','Videos'],['quizzes','Quizzes'],['posts','Posts'],['saved','Saved']];
  if(!setMain(tok,`<div class="row" style="align-items:flex-start;gap:16px">${avatar(p,76)}<div style="flex:1;min-width:0"><h1>${esc(p.name||'Anonymous student')}</h1>${d?`<div class="sub">${esc(d)}</div>`:''}${p.bio?`<p class="pre" style="margin-top:8px">${esc(p.bio)}</p>`:''}</div><div class="row" style="flex:none"><button class="btn ghost" data-act="edit-profile">${ic('edit',16)} Edit profile</button><button class="btn ghost" data-act="logout">${ic('logout',16)} ${S.user&&S.user.guest?'Sign in':'Sign out'}</button></div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<a class="tab ${tab===k?'on':''}" href="#/profile?tab=${k}">${l} (${data[k].length})</a>`).join('')}</div><div id="pres" style="margin-top:14px"></div>
  <p class="fine" style="margin-top:28px">Saved in this browser only. Clearing site data removes it.</p>`))return;
  paintList($('#pres'),data[tab]||[],eng,emptyState(tab==='saved'?'Nothing saved yet.':'No content shared yet.'));
}
function fileToAvatar(file){return new Promise((res,rej)=>{
  if(!file.type.startsWith('image/'))return rej(new Error('Please choose an image file.'));
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const r=Math.max(s/img.width,s/img.height),w=img.width*r,h=img.height*r;c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That image could not be read.'))};img.src=u;
})}
function profileForm(){
  const p=S.me;let newAvatar=null,removeAv=false;
  const m=openModal('Edit profile',`<form class="form" id="prf">
  <div class="row" style="margin-bottom:12px"><span id="avp">${avatar(p,64)}</span><div><input type="file" id="avf" accept="image/*" aria-label="Profile picture"><button type="button" class="lnk" id="avr" style="margin-top:4px">Remove picture</button></div></div>
  <label>Display name<input name="name" maxlength="60" value="${esc(p.name)}"></label>
  <label>Bio<textarea name="bio" rows="3" maxlength="300">${esc(p.bio)}</textarea></label>
  <label>College (optional)<input name="college" maxlength="100" value="${esc(p.college)}"></label>
  <div class="grid3" style="grid-template-columns:1fr 1fr"><label>Branch (optional)<input name="branch" maxlength="60" value="${esc(p.branch)}"></label><label>Semester (optional)<input name="semester" maxlength="20" value="${esc(p.semester)}"></label></div>
  ${formFoot('Save profile')}</form>`);
  $('#avf',m.el).onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{newAvatar=await fileToAvatar(f);removeAv=false;$('#avp',m.el).innerHTML=avatar({avatar:newAvatar},64);showErr(m,'')}catch(ex){showErr(m,ex.message);e.target.value=''}
  };
  $('#avr',m.el).onclick=()=>{removeAv=true;newAvatar=null;$('#avf',m.el).value='';$('#avp',m.el).innerHTML=avatar({name:$('#prf',m.el).name.value},64)};
  $('#prf',m.el).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    const rec={...p,name:fd.get('name').trim(),bio:fd.get('bio').trim(),college:fd.get('college').trim(),branch:fd.get('branch').trim(),semester:fd.get('semester').trim(),avatar:removeAv?'':(newAvatar||p.avatar||'')};
    try{await DB.put('profiles',rec)}catch(ex){return showErr(m,storageMsg(ex))}
    S.me=rec;refreshChrome();m.close();toast('Profile saved.');render();
  };
}

/* ---------- Actions ---------- */
async function toggle(store,a){
  const t=a.dataset.t,id=a.dataset.id,key=t+':'+id,kind=a.dataset.act;
  let on;
  try{
    const ex=await DB.get(store,key);
    if(ex){await DB.del(store,key);on=false}else{await DB.put(store,{id:key,type:t,targetId:id,createdAt:Date.now()});on=true}
  }catch(ex){return toast(storageMsg(ex))}
  $$(`[data-act="${kind}"][data-t="${t}"][data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.innerHTML=btnInner(kind,on)});
}
const ACTIONS={
  like:a=>toggle('likes',a),
  mark:a=>toggle('bookmarks',a),
  open:a=>go(a.dataset.href),
  jump:()=>{const b=$('#cbox');if(b)b.scrollIntoView({behavior:'smooth'})},
  logout:()=>{cleanup();if(_db){try{_db.close()}catch(e){}_db=null}setSess(null);S.me=null;S.user=null;S.route='#/';S.hist=[];$('#side').innerHTML='';$('#top').innerHTML='';$('#bottom').innerHTML='';document.body.classList.remove('is-home','sc');showAuth()},
  google:()=>{const e=$('#aerr');if(e)e.textContent='Google sign-in turns on once the backend is connected. Use email for now.'},
  side:()=>{const on=!document.body.classList.contains('sc');applySide(on);try{localStorage.setItem('orbital-side',on?'1':'0')}catch(e){}},
  scroll:a=>{const el=$(a.dataset.t);if(el)el.scrollBy({left:(+a.dataset.d||1)*Math.max(240,el.clientWidth*.75),behavior:'smooth'})},
  back:()=>{const prev=S.hist.pop();S.route=prev||S.fb||'#/';render()},
  create:()=>createMenu(),
  subject:a=>go('#/discover?subject='+encodeURIComponent(a.dataset.s)),
  'new-post':()=>postForm(),
  'new-note':()=>noteForm(),
  'new-video':()=>videoForm(),
  'new-quiz':()=>quizForm(),
  'new-group':()=>createRoomForm(),
  'edit-profile':()=>profileForm(),
  edit:async a=>{const it=await DB.get(a.dataset.t,a.dataset.id);if(it)editItem(a.dataset.t,it)},
  delete:async a=>{
    const t=a.dataset.t,id=a.dataset.id;
    if(!await confirmBox(`Delete this ${LABEL[t].toLowerCase()}? This cannot be undone.`))return;
    try{await removeItem(t,id)}catch(ex){return toast(storageMsg(ex))}
    toast('Deleted.');
    if(parseHash().seg[1]===id)go(t==='posts'?'#/':'#/'+t);else render();
  },
  dl:async a=>{
    const n=await DB.get('notes',a.dataset.id);if(!n)return;
    const fname=(n.title.replace(/[\\/:*?"<>|]+/g,'').trim()||'note')+'.pdf';
    try{
      const dl=window.claude&&claude.use?await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),1500))]):null;
      if(dl){await dl.save({filename:fname,data:n.file});return}
    }catch(ex){if(ex&&ex.code==='declined')return}
    const u=URL.createObjectURL(n.file),l=document.createElement('a');
    l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  },
  'del-comment':async a=>{
    const box=a.closest('#cbox');
    try{await DB.del('comments',a.dataset.id)}catch(ex){return toast(storageMsg(ex))}
    paintComments(box);
  },
  'copy-link':()=>{const i=$('#rlink');if(i)copyLink(i.value,i)},
  'share-link':a=>shareRoom(a.dataset.id),
  'forget-room':a=>{saveRooms(getRooms().filter(r=>r.id!==a.dataset.id));render()}
};
document.addEventListener('click',async e=>{
  const lk=e.target.closest('a[href^="#/"]');
  if(lk&&!e.defaultPrevented){e.preventDefault();go(lk.getAttribute('href'));return}
  const a=e.target.closest('[data-act]');
  if(a){e.preventDefault();const fn=ACTIONS[a.dataset.act];if(fn)try{await fn(a,e)}catch(ex){console.error(ex);toast('Something went wrong.')}return}
  const o=e.target.closest('[data-open]');
  if(o&&!e.target.closest('a,button,input,textarea,select,video,label'))go(o.dataset.open);
});


/* ---------- accounts (prototype: stored in this browser only) ---------- */
let _adb=null;
const SESSION_KEY='orbital-session';
const getSess=()=>{try{return localStorage.getItem(SESSION_KEY)}catch(e){return S.sess||null}};
const setSess=v=>{S.sess=v;try{v?localStorage.setItem(SESSION_KEY,v):localStorage.removeItem(SESSION_KEY)}catch(e){}};
function openAuthDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));
  const r=indexedDB.open('orbital-auth',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('accounts'))r.result.createObjectStore('accounts',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Could not open account storage.'));
})}
const atx=(mode,fn)=>new Promise((res,rej)=>{let t;try{t=_adb.transaction('accounts',mode)}catch(e){return rej(e)}let out;const rq=fn(t.objectStore('accounts'));if(rq)rq.onsuccess=()=>{out=rq.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)});
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async t=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));
async function hashPw(pw,saltHex){
  const salt=Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256));
}
async function startApp(user){
  S.user=user;
  const name=user.guest?'orbital-prototype':'orbital-u-'+(await sha(user.email)).slice(0,20);
  if(_db){try{_db.close()}catch(e){}}
  _db=await openDB(name);_db.onversionchange=()=>{_db.close()};
  await loadMe();
  if(user.name&&!S.me.name){S.me={...S.me,name:user.name};try{await DB.put('profiles',S.me)}catch(e){}}
  document.body.classList.remove('auth-mode');
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  S.hist=[];shell();render();
}
function showAuth(mode='signin'){
  const su=mode==='signup';
  document.body.classList.add('auth-mode');document.body.classList.remove('is-home');
  $('#main').innerHTML=`<div class="auth">
  <section class="auth-form">
    <a class="logo" href="#/" aria-label="orbital">${LOGO}<span>orbital</span></a>
    <div class="auth-card">
      <h1>${su?'Create your account':'Welcome back'}</h1>
      <p class="sub">${su?'Join Orbital to share notes, videos and quizzes with your classmates.':'Sign in to pick up where you left off.'}</p>
      <div class="seg authseg" role="tablist"><button type="button" role="tab" class="${su?'':'on'}" data-m="signin" aria-selected="${!su}">Sign in</button><button type="button" role="tab" class="${su?'on':''}" data-m="signup" aria-selected="${su}">Create account</button></div>
      <button class="btn ghost wide gbtn" type="button" data-act="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
      <div class="or">or use email</div>
      <form id="af" novalidate>
        ${su?`<label for="af-name">Full name<input id="af-name" name="name" autocomplete="name" placeholder="Your name" required></label>`:''}
        <label for="af-email">Email<input id="af-email" name="email" type="email" autocomplete="username" placeholder="you@college.edu" required></label>
        <label for="af-pw">Password<div class="pwrow"><input id="af-pw" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'At least 8 characters':'Your password'}" required><button type="button" class="pwt" id="pwt" aria-label="Show password">Show</button></div></label>
        <p class="aerr" id="aerr" role="alert"></p>
        <button class="btn wide" id="asub" type="submit">${su?'Create account':'Sign in'}</button>
      </form>
      <p class="fine">Prototype: accounts and content stay in this browser only. Don't reuse a real password.</p>
    </div>
  </section>
  <aside class="auth-art" aria-hidden="true">
    <div class="stk a1"><i></i><i></i><i></i><i></i><span class="sk-t">${ic('notes',16)} Notes</span><span class="sk-s">share PDFs</span></div>
    <div class="stk a2"><span class="sk-t">${ic('quiz',16)} Quizzes</span><span class="sk-s">test each other</span></div>
    <div class="stk a3"><span class="sk-t">${ic('video',16)} Videos</span><span class="sk-s">quick explainers</span></div>
    <div class="stk a4"><span class="sk-t"><span class="live"></span> Study rooms</span><span class="sk-s">study live</span></div>
    <h2>Everything revolving around a student's daily routine.</h2>
  </aside></div>`;
  window.scrollTo(0,0);
  $$('[data-m]').forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
  $('#pwt').onclick=()=>{const i=$('#af-pw'),show=i.type==='password';i.type=show?'text':'password';$('#pwt').textContent=show?'Hide':'Show'};
  const f=$('#af');
  f.onsubmit=async e=>{
    e.preventDefault();const err=$('#aerr'),btn=$('#asub');err.textContent='';btn.disabled=true;
    try{
      const email=f.email.value.trim().toLowerCase(),pw=f.password.value,name=su?f.name.value.trim():'';
      if(su&&!name)throw new Error('Enter your name.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Enter a valid email address.');
      if(!pw)throw new Error('Enter your password.');
      if(su&&pw.length<8)throw new Error('Use at least 8 characters for your password.');
      if(!(window.crypto&&crypto.subtle))throw new Error('This browser cannot create secure accounts. Try another browser.');
      let acc=await atx('readonly',s=>s.get(email));
      if(su){
        if(acc)throw new Error('An account with this email already exists. Try signing in.');
        const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
        acc={id:email,email,name,salt,hash:await hashPw(pw,salt),createdAt:Date.now()};
        await atx('readwrite',s=>s.put(acc));
      }else if(!acc||acc.hash!==await hashPw(pw,acc.salt))throw new Error('Email or password is incorrect.');
      setSess(email);await startApp(acc);
    }catch(ex){err.textContent=ex.message||'Something went wrong.';btn.disabled=false}
  };
  (su?$('#af-name'):$('#af-email')).focus();
}

/* ---------- boot ---------- */
(async function boot(){
  const rid=roomFromHash();if(rid)S.route='#/room/'+rid;
  try{
    _adb=await openAuthDB();
    const sess=getSess();
    if(sess==='guest')setSess(null);
    if(sess){const a=await atx('readonly',s=>s.get(sess));if(a){await startApp(a);return}setSess(null)}
    showAuth();
  }catch(e){
    $('#main').innerHTML=`<div class="empty"><p><b>Orbital can't start.</b></p><p>${esc(e.message||e)}</p><p class="sub">Orbital stores your content in your browser's IndexedDB. Private browsing modes or blocked site data can prevent this.</p></div>`;
  }
})();
window.addEventListener('hashchange',()=>{const id=roomFromHash();if(id&&S.route!=='#/room/'+id&&_db)go('#/room/'+id)});
</script>
