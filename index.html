<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbital</title>
<meta name="description" content="Orbital is a student-powered knowledge-sharing platform: notes, videos, quizzes and study groups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fff;--surface:#fff;--ink:#1C1A24;--muted:#6B6878;--line:#ECE9F3;--line2:#DCD7E8;--lav:#E9E1FB;--lav2:#D3C6F7;--lav-ink:#4B3BB0;--peach:#FFE3D6;--peach2:#FFC9AE;--butter:#FFF1BF;--butter2:#FBE184;--mint:#DAF2E4;--cream:#F5F2FB;--teal:#1F5F58;--danger:#B42318;--ok:#1A7F37;--heart:#E0345A;--r:18px;--sw:252px;--shadow:0 1px 2px rgba(28,26,36,.04),0 8px 22px -14px rgba(28,26,36,.16);--shadow-h:0 2px 4px rgba(28,26,36,.05),0 22px 44px -18px rgba(60,40,140,.30);--ease:cubic-bezier(.22,.8,.3,1);--serif:'Newsreader','Iowan Old Style',Georgia,'Times New Roman',serif;color-scheme:light;--font:'DM Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font);margin:0;letter-spacing:-.02em}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;font-weight:500;letter-spacing:-.025em;overflow-wrap:anywhere}
h2{font-size:18px;font-weight:700;margin:32px 0 12px}
h3{font-size:17px;line-height:1.3;font-weight:700}
a{color:inherit}
p{margin:0 0 12px}
:focus-visible{outline:2px solid var(--lav-ink);outline-offset:2px}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45}
.pre{white-space:pre-wrap;word-wrap:break-word}
.sub{color:var(--muted);font-size:14px}
.lbl-h{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0 0 12px;color:var(--muted)}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
#app{display:flex;min-height:100vh}
#side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 14px 14px;z-index:40}
#shell{margin-left:var(--sw);flex:1;min-width:0;padding:0 44px 72px;display:flex;flex-direction:column;min-height:100vh}
body.is-home #shell{background:linear-gradient(180deg,#E8E0FB 0,#F1ECFD 280px,#fff 640px) no-repeat}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:26px;letter-spacing:-.045em;flex:none;line-height:1}
.logo svg{transition:transform .6s var(--ease)}
.logo:hover svg{transform:rotate(25deg)}
#side .logo{padding:0 10px}
.snav{display:flex;flex-direction:column;gap:4px;margin:34px 0 12px;flex:1;overflow-y:auto;scrollbar-width:none}
.snav a{position:relative;display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:14px;font-size:15.5px;font-weight:500;color:#3C3A48;text-decoration:none;transition:background .2s,color .2s}
.snav a .ic{stroke-width:1.5;flex:none}
.snav a:hover{background:var(--cream);color:var(--ink)}
.snav a.on{font-weight:700;color:var(--ink);background:#F1ECFC}
.snav a.on .ic{stroke-width:2}
.snav a.on::after{content:"";position:absolute;right:-15px;top:7px;bottom:7px;width:4px;border-radius:4px 0 0 4px;background:var(--ink)}
.sbadge{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--lav2);color:var(--lav-ink);border-radius:999px;padding:3px 9px}
.suser{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;text-decoration:none;font-weight:600;font-size:15px;transition:background .2s;border-top:1px solid transparent;min-width:0}
.suser:hover,.suser.on{background:var(--cream)}
.suser .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suser .sn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.sbtn{display:flex;width:100%;align-items:center;gap:16px;padding:10px 14px;border:0;background:none;border-radius:14px;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:6px;transition:background .2s,color .2s}
.sbtn:hover{background:var(--cream);color:var(--ink)}
.sbtn .ic{stroke-width:1.6;transition:transform .3s var(--ease)}
body.sc{--sw:80px}
body.sc #side{padding:24px 10px 14px}
body.sc #side .logo{justify-content:center;padding:0}
body.sc #side .logo span,body.sc .snav .nl,body.sc .sbadge,body.sc .suser .sn,body.sc .sbtn .nl{display:none}
body.sc .snav a{justify-content:center;padding:14px 0}
body.sc .snav a.on::after{right:-11px}
body.sc .suser,body.sc .sbtn{justify-content:center;padding:10px 0}
body.sc .stoggle .ic{transform:rotate(180deg)}
body.sc #shell{padding:0 28px 64px}
body.sc #top{margin:0 -28px;padding:0 28px}
#side,#shell{transition:width .3s var(--ease),margin-left .3s var(--ease)}
/* auth */
body.auth-mode #side,body.auth-mode #top,body.auth-mode #bottom{display:none!important}
body.auth-mode #shell{margin-left:0;padding:0;background:none}
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:100vh}
.auth-form{display:flex;flex-direction:column;padding:34px clamp(24px,5vw,72px);min-width:0}
.auth-card{width:min(420px,100%);margin:auto 0;padding:28px 0}
.auth-card h1{font-size:clamp(36px,4vw,48px);margin:0 0 8px}
.auth-card .sub{margin:0 0 24px;font-size:15.5px}
.authseg{display:flex;width:100%;margin-bottom:22px}
.authseg button{flex:1;justify-content:center;padding:9px 14px}
.pwrow{position:relative;margin-top:5px}
.pwrow input{margin-top:0;padding-right:70px}
.pwt{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--lav-ink);cursor:pointer;padding:6px 8px;border-radius:8px}
.pwt:hover{background:var(--cream)}
.auth-card .btn.wide{margin:6px 0 0;padding:13px 20px;font-size:15.5px}
.aerr{color:var(--danger);font-size:14px;margin:0 0 4px;min-height:20px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.gbtn{gap:12px}.gbtn svg{width:20px;height:20px;flex:none}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-card .fine{margin-top:18px}
.auth-art{position:relative;overflow:hidden;background:linear-gradient(160deg,#E2D8FA 0,#EFE9FC 55%,#FAF8FF 100%);display:flex;align-items:center;justify-content:center;padding:48px;min-height:520px}
.auth-art h2{position:relative;z-index:2;font-family:var(--serif);font-weight:500;font-size:clamp(34px,3.6vw,52px);line-height:1.08;letter-spacing:-.03em;text-align:center;max-width:430px;margin:0}
.auth-art .stk{display:flex;position:absolute}
.auth-art .a1{left:9%;top:12%;--rot:-7deg;width:168px;background:var(--lav2)}
.auth-art .a2{right:9%;top:9%;--rot:6deg;width:158px;background:var(--butter)}
.auth-art .a3{left:11%;bottom:11%;--rot:5deg;width:168px;background:var(--peach)}
.auth-art .a4{right:10%;bottom:12%;--rot:-5deg;width:170px;background:var(--mint)}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-form{background:linear-gradient(180deg,#ECE6FC 0,#fff 300px);min-height:100vh}}
/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:78px;margin:0 -44px;padding:0 44px;transition:background .25s,box-shadow .25s}
#top.scrolled{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.ptitle{display:none;font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.025em;margin:0}
body.is-home .ptitle{display:block}
.mlogo,#topAvatar{display:none}
.tspace{flex:1}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;width:min(440px,100%);color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--lav2);box-shadow:0 0 0 4px rgba(207,195,245,.35)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:0;height:100%;background:transparent;color:var(--ink);min-width:0;width:100%;margin:0;border-radius:0}
.search input:focus{outline:0;box-shadow:none}
body.is-home #gs{display:none}
#main{display:block;flex:1;padding-top:6px;min-width:0}
#main>*{animation:pageIn .5s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* pages */
.page{padding:12px 0 0}
.page.cell{background:transparent;border:0;border-radius:0}
.page.narrow{max-width:820px;width:100%;margin:0 auto}
.page.narrow.cell{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:32px 38px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:clamp(30px,4vw,44px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font:inherit;font-size:14px;font-weight:600;margin-bottom:14px;background:none;border:0;padding:6px 12px 6px 8px;margin-left:-8px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.back:hover{background:var(--cream);color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:999px;padding:10px 20px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .18s var(--ease),box-shadow .2s,background .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(27,26,31,.45)}
.btn:active{transform:scale(.96);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--cream);box-shadow:none}
.btn.cta{background:var(--lav);color:var(--ink);border-color:var(--lav)}
.btn.cta:hover{background:var(--lav2);box-shadow:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%;margin:8px 0;column-span:all}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}
.lnk.danger{color:var(--danger)}
/* home */
.home{display:block}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:440px;padding:6px 0 40px}
.herotxt{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.hero-h{font-family:var(--serif);font-size:clamp(40px,5.4vw,66px);line-height:1.04;letter-spacing:-.035em;font-weight:500;margin:0 0 12px}
.hero-p{color:#4A4658;font-size:17px;margin:0 0 30px;max-width:540px}
.hsearch{position:relative;display:flex;align-items:center;gap:12px;width:min(580px,100%);height:60px;padding:0 24px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);box-shadow:0 12px 32px -18px rgba(75,59,176,.45);transition:box-shadow .25s,border-color .25s}
.hsearch:focus-within{border-color:var(--lav2);box-shadow:0 0 0 5px rgba(207,195,245,.4),0 12px 32px -18px rgba(75,59,176,.45)}
.hsearch input{flex:1;border:0;outline:0;background:transparent;font-size:17px;padding:0;height:100%;border-radius:0;margin:0;min-width:0;position:relative;z-index:1}
.hsearch input:focus{box-shadow:none}
.phf{position:absolute;left:58px;pointer-events:none;font-size:17px;color:#8C88A0;white-space:nowrap}
.phf b{color:var(--ink);font-weight:600;display:inline-block;transition:opacity .25s,transform .25s}
.hsearch input:not(:placeholder-shown)~.phf{display:none}
.hq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.hq button{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(75,59,176,.14);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .2s,transform .18s var(--ease)}
.hq button:hover{background:#fff;transform:translateY(-1px)}
.hq button:active{transform:scale(.96)}
/* floating stickers */
.stk{position:absolute;z-index:1;display:flex;flex-direction:column;gap:7px;padding:14px;border:6px solid #fff;border-radius:16px;text-decoration:none;color:var(--ink);box-shadow:0 18px 34px -14px rgba(60,40,140,.35);transform:rotate(var(--rot));transition:transform .45s var(--ease),box-shadow .3s;animation:bob 7s ease-in-out infinite}
.stk:hover{transform:rotate(0) scale(1.06);box-shadow:0 26px 44px -16px rgba(60,40,140,.45)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.stk .sk-t{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.02em}
.stk .sk-s{font-size:12.5px;font-weight:600;color:#4A4658}
.stk i{display:block;height:7px;border-radius:6px;background:rgba(255,255,255,.8)}
.stk i:nth-of-type(1){width:80%}.stk i:nth-of-type(2){width:100%}.stk i:nth-of-type(3){width:62%}.stk i:nth-of-type(4){width:90%}
.s1{left:0;top:26px;--rot:-7deg;width:168px;background:var(--lav)}
.s2{right:0;top:22px;--rot:6deg;width:156px;background:var(--butter);animation-delay:-2s}
.s2 b{font-family:var(--serif);font-size:54px;font-weight:500;line-height:.95;letter-spacing:-.05em}
.s3{left:1%;bottom:46px;--rot:5deg;width:164px;background:var(--peach);animation-delay:-4s}
.s3 .sk-p{aspect-ratio:16/9;border-radius:8px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.s3 .sk-p span{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.s4{right:1%;bottom:40px;--rot:-5deg;width:164px;background:var(--mint);animation-delay:-1s}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1FA45B;box-shadow:0 0 0 0 rgba(31,164,91,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(31,164,91,0)}100%{box-shadow:0 0 0 0 rgba(31,164,91,0)}}
/* topic chips */
.chiprow{position:relative;display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.chipnav{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 12px;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.chipnav::-webkit-scrollbar{display:none}
.cn{flex:none;font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 22px;box-shadow:0 1px 2px rgba(28,26,36,.04),0 4px 10px -6px rgba(28,26,36,.12);transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.cn:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);background:#FBF9FF}
.cn:active{transform:scale(.97)}
.rb{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s var(--ease),background .2s}
.rb:hover{background:var(--cream)}
.rb:active{transform:scale(.9)}
/* sections / rails */
.railsec{margin-top:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{margin:0;font-size:23px;letter-spacing:-.03em;font-weight:700}
.sec-r{display:flex;align-items:center;gap:10px}
.sec-r .rb{width:32px;height:32px;box-shadow:none}
.va{font-weight:600;font-size:15px;color:var(--teal);text-decoration:none;margin-right:6px}
.va:hover{text-decoration:underline;text-underline-offset:3px}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 4px 22px;margin:0 -4px;scrollbar-width:none;align-items:stretch}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 clamp(236px,21vw,290px);margin:0;scroll-snap-align:start;animation:none}
.rail .card:nth-child(n) .vthumb{aspect-ratio:16/10}
.rail .card:nth-child(n) .cvis{min-height:128px}
/* onboarding + together */
.startgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sg{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;border:0;border-radius:20px;padding:22px;min-height:180px;font:inherit;color:var(--ink);cursor:pointer;position:relative;transition:transform .3s var(--ease),box-shadow .3s}
.sg:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow-h)}
.sg:active{transform:scale(.98)}
.sg .tico{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center}
.sg b{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.sg span{font-size:14px;color:#45424B}
.sg .tgo{position:absolute;right:18px;bottom:18px;opacity:.5;transition:transform .25s var(--ease),opacity .2s}
.sg:hover .tgo{transform:translateX(3px);opacity:1}
.c-lav{background:var(--lav)}.c-peach{background:var(--peach)}.c-butter{background:var(--butter)}.c-cream{background:var(--cream)}.c-mint{background:var(--mint)}
.together{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.tg{display:flex;align-items:center;gap:18px;border-radius:22px;padding:26px 28px;text-decoration:none;color:var(--ink);transition:transform .3s var(--ease),box-shadow .3s}
.tg:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.tg .tico{width:56px;height:56px;flex:none;border-radius:50%;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center}
.tg h3{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.tg p{margin:0;font-size:14.5px;color:#45424B}
.tg .btn{margin-top:12px}
.feedwrap{margin-top:40px}
.composer{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 20px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);font:inherit;color:var(--muted);text-align:left;cursor:pointer;transition:box-shadow .25s,transform .2s var(--ease)}
.composer:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.composer .ct{flex:1;font-size:16px}
.composer .btn{pointer-events:none;padding:8px 18px}
/* masonry */
#feed,#lres,#dres,#pres{column-count:3;column-gap:20px}
.empty{column-span:all;border:1.5px dashed var(--line2);border-radius:26px;padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty p{margin-bottom:14px}
.eart{width:72px;height:72px;margin:0 auto 10px;display:block;animation:float 6s ease-in-out infinite}

input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;width:100%;transition:border-color .2s,box-shadow .2s}

.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}

/* library */
.cafe{--green:#4B3BB0;--green-ink:#fff;--amber:#FBE184;--line:#ECE8DF;--free:#E4DCFB;--taken:#EFEBE2;--pick:#4B3BB0;--surface:#fff;--ink:#1B1A1F;--muted:#6A665E;font-family:var(--font);color:var(--ink);line-height:1.55;max-width:760px;margin:0 auto}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const LABEL={notes:'Note',videos:'Video',quizzes:'Quiz',posts:'Post'};
const TYPE_ICON={notes:'notes',videos:'video',quizzes:'quiz',posts:'comment'};
const PAGE=10;
const S={route:'#/',hist:[],fb:'#/',tok:0,urls:[],ios:[],cleanups:[],me:null};

const ICONS={
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',

user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',

edit:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
play:'<polygon points="6 3 20 12 6 21 6 3"/>',

link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',

phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
board:'<rect x="3" y="3" width="18" height="12" rx="2"/><path d="M12 15v6M8 21h8"/>',

const ic=(n,s=18,fill=false)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const LOGO='<svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="7.5" fill="#CFC3F5" stroke="#1B1A1F" stroke-width="2"/><ellipse cx="16" cy="16" rx="14" ry="5.6" transform="rotate(-24 16 16)" stroke="#1B1A1F" stroke-width="2"/><circle cx="27.2" cy="9.4" r="3" fill="#FBE184" stroke="#1B1A1F" stroke-width="2"/></svg>';

function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB'}
const myName=()=>(S.me&&S.me.name)||'Anonymous student';
function avatar(p,size=22){
  const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.45)}px`;
  if(p&&p.avatar)return `<img class="av" style="${st}" src="${esc(p.avatar)}" alt="">`;
  const n=(p&&p.name||'').trim();
  return `<span class="av ph" style="${st}">${n?esc(n[0].toUpperCase()):ic('user',Math.round(size*.6))}</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
const storageMsg=ex=>(ex&&ex.name==='QuotaExceededError')?'Browser storage is full. Delete some content or use a smaller file.':'Could not save: '+((ex&&ex.message)||'unknown error');

/* ---------- IndexedDB ---------- */
const STORES=['profiles','notes','videos','quizzes','attempts','groups','messages','comments','likes','bookmarks','members','posts'];
let _db=null;
function openDB(name='orbital-prototype'){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));
  const r=indexedDB.open(name,1);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error||new Error('Could not open local storage.'));
  r.onblocked=()=>rej(new Error('Local storage is blocked by another Orbital tab.'));
})}
const tx=(store,mode,fn)=>new Promise((res,rej)=>{
  let t;try{t=_db.transaction(store,mode)}catch(e){return rej(e)}
  let out;const rq=fn(t.objectStore(store));
  if(rq)rq.onsuccess=()=>{out=rq.result};
  t.oncomplete=()=>res(out);
  t.onerror=()=>rej(t.error);
  t.onabort=()=>rej(t.error||new Error('Transaction aborted'));
});
const DB={
  get:(s,id)=>tx(s,'readonly',o=>o.get(id)),
  all:s=>tx(s,'readonly',o=>o.getAll()),
  put:(s,v)=>tx(s,'readwrite',o=>o.put(v)),
  del:(s,id)=>tx(s,'readwrite',o=>o.delete(id))
};

/* ---------- data helpers ---------- */
async function loadMe(){
  S.me=(await DB.get('profiles','me'))||{id:'me',name:'',bio:'',college:'',branch:'',semester:'',avatar:''};
}
async function loadEng(){
  const [L,B,C]=await Promise.all([DB.all('likes'),DB.all('bookmarks'),DB.all('comments')]);
  const e={likes:new Set(L.map(x=>x.id)),marks:new Set(B.map(x=>x.id)),comments:{}};
  C.forEach(c=>{const k=c.type+':'+c.targetId;e.comments[k]=(e.comments[k]||0)+1});
  return e;
}
async function allContent(){
  const ts=['notes','videos','quizzes','posts'];
  const res=await Promise.all(ts.map(s=>DB.all(s)));
  return res.flatMap((arr,i)=>arr.map(x=>({...x,_t:ts[i]}))).sort((a,b)=>b.createdAt-a.createdAt);
}
async function subjectList(){
  const out=[];
  for(const s of['notes','videos','quizzes'])(await DB.all(s)).forEach(x=>x.subject&&out.push(x.subject));
  return [...new Set(out)].sort((a,b)=>a.localeCompare(b));
}
async function removeItem(t,id){
  await DB.del(t,id);
  for(const c of await DB.all('comments'))if(c.type===t&&c.targetId===id)await DB.del('comments',c.id);
  await DB.del('likes',t+':'+id);await DB.del('bookmarks',t+':'+id);
  if(t==='quizzes')for(const a of await DB.all('attempts'))if(a.quizId===id)await DB.del('attempts',a.id);
}

/* ---------- UI primitives ---------- */
function openModal(title,html,opts={}){
  const root=$('#modal-root');
  const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="dlg ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}</h2><button class="x" type="button" aria-label="Close" data-close>${ic('x',20)}</button></div><div class="db">${html}</div></div>`;
  root.appendChild(el);document.body.style.overflow='hidden';
  let closed=false;
  const onKey=e=>{if(e.key==='Escape'&&!opts.sticky)close()};
  function close(){
    if(closed)return;closed=true;
    document.removeEventListener('keydown',onKey);
    if(opts.onClose)opts.onClose();
    el.remove();if(!root.children.length)document.body.style.overflow='';
  }
  document.addEventListener('keydown',onKey);
  el.addEventListener('mousedown',e=>{if(e.target===el&&!opts.sticky)close()});
  $$('[data-close]',el).forEach(b=>b.addEventListener('click',close));
  return {el,close,body:$('.db',el)};
}
function confirmBox(msg,label='Delete'){
  return new Promise(res=>{
    const m=openModal('Please confirm',`<p>${esc(msg)}</p><div class="row end"><button class="btn ghost" data-close>Cancel</button><button class="btn danger-solid" id="yes">${esc(label)}</button></div>`,{onClose:()=>res(false)});
    $('#yes',m.el).onclick=()=>{res(true);m.close()};
  });
}
function go(h){if(S.route!==h){S.hist.push(S.route);if(S.hist.length>60)S.hist.shift()}S.route=h;render()}
const EART='<svg class="eart" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="14" fill="#E4DCFB" stroke="#1B1A1F" stroke-width="2.5"/><ellipse cx="32" cy="32" rx="28" ry="10" transform="rotate(-22 32 32)" stroke="#1B1A1F" stroke-width="2.5"/><circle cx="53" cy="17" r="4.5" fill="#FBE184" stroke="#1B1A1F" stroke-width="2.5"/></svg>';
const emptyState=(msg,action='')=>`<div class="empty">${EART}<p>${esc(msg)}</p>${action}</div>`;
const notFound=what=>`<div class="empty"><p>${esc(what)} not found. It may have been deleted.</p><a class="btn ghost" href="#/">Go to Home</a></div>`;
const tagsHtml=it=>{const a=[it.subject,it.branch,it.semester&&('Sem '+it.semester)].filter(Boolean);return a.length?`<div class="tags">${a.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''};

/* ---------- cards ---------- */
function btnInner(kind,on){return kind==='like'?`${ic('heart',18,on)}<span class="n">${on?1:''}</span>`:ic('bookmark',18,on)}
function actBtns(t,id,eng){
  const k=t+':'+id,liked=eng.likes.has(k),marked=eng.marks.has(k),cc=eng.comments[k]||0;
  return `<button class="act ${liked?'on':''}" data-act="like" data-t="${t}" data-id="${id}" aria-label="Like" title="Like">${btnInner('like',liked)}</button>
  <button class="act" data-act="open" data-href="#/${t}/${id}?c=1" aria-label="Comments" title="Comments">${ic('comment',18)}<span class="n">${cc||''}</span></button>
  <button class="act ${marked?'on':''}" data-act="mark" data-t="${t}" data-id="${id}" aria-label="Bookmark" title="Bookmark">${btnInner('mark',marked)}</button>`;
}
function card(it,eng){
  const t=it._t;
  const tone=['lav','peach','butter','cream'][(parseInt(String(it.id).slice(-2),16)||0)%4];
  let vis='',body='';
  if(t==='posts')body=`${it.title?`<h3>${esc(it.title)}</h3>`:''}<p class="desc big pre">${esc(it.body)}</p>`;
  else{
    if(t==='videos')vis=`<div class="vthumb" data-vid="${it.id}">${ic('play',24,true)}</div>`;
    if(t==='notes')vis=`<div class="cvis cv-note"><span class="pdfchip">PDF</span><i></i><i></i><i></i><i></i><i></i></div>`;
    if(t==='quizzes')vis=`<div class="cvis cv-quiz"><b>${it.questions.length}</b><span>question${it.questions.length===1?'':'s'}</span></div>`;
    body=`<h3>${esc(it.title)}</h3>${it.description?`<p class="desc">${esc(it.description)}</p>`:''}`;
    if(t==='notes')body+=`<div class="sub">${fmtSize(it.size||0)}</div>`;
    body+=tagsHtml(it);
  }
  return `<article class="card t-${t} tone-${tone}" data-open="#/${t}/${it.id}">${vis}<div class="cb"><span class="kind">${ic(TYPE_ICON[t],13)} ${LABEL[t]}</span>${body}<div class="cfoot"><div class="byline">${avatar(S.me,22)}<b>${esc(myName())}</b><span>·</span><span>${ago(it.createdAt)}</span></div><div class="actions">${actBtns(t,it.id,eng)}</div></div></div></article>`;
}
function studentCard(p){
  const d=[p.college,p.branch,p.semester&&('Semester '+p.semester)].filter(Boolean).join(' · ');
  return `<div class="stu" data-open="#/profile">${avatar(p,44)}<div><b>${esc(p.name)}</b><div class="sub">${esc(d)}</div>${p.bio?`<div class="desc" style="margin:2px 0 0">${esc(p.bio)}</div>`:''}</div></div>`;
}
const cardAny=(it,eng)=>it._t==='students'?studentCard(it):card(it,eng);

function paintList(el,items,eng,emptyHtml,fn=card){
  el.innerHTML='';
  if(!items.length){el.innerHTML=emptyHtml;return}
  let shown=0;
  const more=document.createElement('button');more.className='btn ghost wide';more.textContent='Load more';
  more.onclick=next;
  el.appendChild(more);
  function next(){
    const slice=items.slice(shown,shown+PAGE);shown+=slice.length;
    more.insertAdjacentHTML('beforebegin',slice.map(i=>fn(i,eng)).join(''));
    hydrateThumbs(el);
    if(shown>=items.length)more.remove();
  }
  next();
}
function hydrateThumbs(root){
  const els=$$('.vthumb:not([data-h])',root);if(!els.length||!window.IntersectionObserver)return;
  const io=new IntersectionObserver(async es=>{
    for(const en of es){
      if(!en.isIntersecting)continue;
      const el=en.target;io.unobserve(el);
      try{
        const rec=await DB.get('videos',el.dataset.vid);
        if(!rec||!el.isConnected)continue;
        const u=URL.createObjectURL(rec.file);S.urls.push(u);
        const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.src=u+'#t=0.1';
        v.onloadeddata=()=>el.classList.add('ready');
        el.prepend(v);
      }catch(e){}
    }
  },{rootMargin:'200px'});
  els.forEach(e=>{e.dataset.h=1;io.observe(e)});S.ios.push(io);
}

/* ---------- shell / router ---------- */
const NAV=[
 {k:'home',h:'#/',l:'Home',s:'Home',i:'home',m:1},
 {k:'discover',h:'#/discover',l:'Discover',s:'Discover',i:'discover',m:1},
 {k:'notes',h:'#/notes',l:'Notes',s:'Notes',i:'notes'},
 {k:'videos',h:'#/videos',l:'Videos',s:'Videos',i:'video'},
 {k:'quizzes',h:'#/quizzes',l:'Quizzes',s:'Quizzes',i:'quiz'},

function shell(){
  const mob=NAV.filter(n=>n.m),mlink=n=>`<a data-nav="${n.k}" href="${n.h}">${ic(n.i,21)}<span>${n.s}</span></a>`;
  $('#side').innerHTML=`<a class="logo" href="#/" aria-label="orbital home">${LOGO}<span>orbital</span></a>
  <nav class="snav" aria-label="Primary">${NAV.filter(n=>!n.nt).map(n=>`<a data-nav="${n.k}" href="${n.h}" title="${n.l}">${ic(n.i,22)}<span class="nl">${n.l}</span>${n.b?`<em class="sbadge">${n.b}</em>`:''}</a>`).join('')}</nav>
  <button class="sbtn stoggle" id="stoggle" data-act="side" aria-label="Collapse or expand sidebar" aria-expanded="true">${ic('chevl',22)}<span class="nl">Collapse</span></button>
  <button class="sbtn" data-act="logout" title="${S.user&&S.user.guest?'Sign in':'Sign out'}">${ic('logout',22)}<span class="nl">${S.user&&S.user.guest?'Sign in':'Sign out'}</span></button>
  <a class="suser" id="suser" data-nav="profile" href="#/profile" title="Profile"></a>`;
  $('#top').innerHTML=`<a class="logo mlogo" href="#/" aria-label="orbital home">${LOGO}<span>orbital</span></a>
  <h1 class="ptitle" id="ptitle">Home</h1>
  <form class="search" id="gs" role="search">${ic('search',17)}<input name="q" placeholder="Search notes, videos, quizzes, students" aria-label="Search Orbital" autocomplete="off"></form>
  <span class="tspace"></span>
  <button class="btn createbtn" data-act="create" aria-label="Create">${ic('plus',16)}<span class="lbl">Create</span></button>

async function showPdf(box,blob){
  const fallback=msg=>{
    const u=URL.createObjectURL(blob);S.urls.push(u);
    box.innerHTML=`${msg?`<p class="muted" style="margin:6px">${esc(msg)}</p>`:''}<iframe title="PDF preview" src="${u}"></iframe>`;
  };
  if(!window.pdfjsLib)return fallback('The PDF viewer library could not load (are you offline?). Using your browser\'s built-in viewer instead.');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
    S.cleanups.push(()=>{try{pdf.destroy()}catch(e){}});
    box.innerHTML='';
    const io=new IntersectionObserver(es=>{es.forEach(async en=>{
      if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
      try{
        const page=await pdf.getPage(+el.dataset.p);
        const w=el.clientWidth||600;const base=page.getViewport({scale:1});
        const scale=w/base.width,dpr=Math.min(window.devicePixelRatio||1,2);
        const vp=page.getViewport({scale:scale*dpr});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        el.style.minHeight='0';el.prepend(c);
      }catch(e){}
    })},{rootMargin:'400px'});
    S.ios.push(io);
    for(let i=1;i<=pdf.numPages;i++){
      const d=document.createElement('div');d.className='pdfpage';d.dataset.p=i;
      d.innerHTML=`<span class="pn">Page ${i} of ${pdf.numPages}</span>`;
      box.appendChild(d);io.observe(d);
    }
  }catch(e){fallback('Could not render this PDF with the built-in viewer.')}
}

function paintQuiz(box,it){
  box.innerHTML=`<form id="qa">${it.questions.map((q,i)=>`<fieldset class="qa"><legend>${i+1}. ${esc(q.q)}</legend>${q.options.map((o,j)=>`<label class="ao"><input type="radio" name="q${i}" value="${j}" required><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="btn">Submit answers</button></form><div id="qres"></div><div id="atts"></div>`;
  $('#qa',box).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    const answers=it.questions.map((_,i)=>+fd.get('q'+i));
    const score=answers.reduce((s,a,i)=>s+(a===it.questions[i].correct?1:0),0);
    try{await DB.put('attempts',{id:uid(),quizId:it.id,answers,score,total:it.questions.length,createdAt:Date.now()})}catch(ex){return toast(storageMsg(ex))}
    showQuizResult(box,it,answers,score);
  };
  paintAttempts(it);
}
function showQuizResult(box,it,answers,score){
  const pct=Math.round(score/it.questions.length*100);
  $('#qa',box).hidden=true;
  $('#qres',box).innerHTML=`<p class="score">You scored ${score} / ${it.questions.length} (${pct}%)</p>${it.questions.map((q,i)=>`<div class="qa"><div style="font-weight:600;font-size:17px;margin-bottom:8px">${i+1}. ${esc(q.q)}</div>${q.options.map((o,j)=>{
    const right=j===q.correct,mine=j===answers[i];
    return `<div class="ao ${right?'right':(mine?'wrong':'')}"><span>${esc(o)}</span>${right?`<span class="lab" style="color:var(--ok)">${mine?'Your answer · Correct':'Correct answer'}</span>`:(mine?`<span class="lab" style="color:var(--danger)">Your answer</span>`:'')}</div>`}).join('')}</div>`).join('')}<button class="btn ghost" id="retry">Try again</button>`;
  $('#retry',box).onclick=()=>paintQuiz(box,it);
  paintAttempts(it);
  $('#qres',box).scrollIntoView({block:'start'});
}
async function paintAttempts(it){
  const at=(await DB.all('attempts')).filter(a=>a.quizId===it.id).sort((a,b)=>b.createdAt-a.createdAt);
  const el=$('#atts');if(!el)return;
  el.innerHTML=`<h2>Your attempts</h2>${at.length?at.map(a=>`<div class="cm" style="display:flex;justify-content:space-between"><span>${a.score} / ${a.total}</span><span class="sub">${ago(a.createdAt)}</span></div>`).join(''):'<p class="muted">No attempts yet.</p>'}`;

async function noteForm(existing){
  const subs=await subjectList();
  const m=openModal(existing?'Edit note':'Upload a note',`<form class="form" id="nf">${existing?'':`<label>PDF file<input type="file" name="file" accept="application/pdf,.pdf" required></label>`}${metaFields(existing||{},subs)}${formFoot(existing?'Save changes':'Publish note')}</form>`,{wide:true});
  const f=$('#nf',m.el);
  if(!existing)f.file.onchange=()=>{const fl=f.file.files[0];if(fl&&!f.title.value)f.title.value=fl.name.replace(/\.pdf$/i,'')};
  f.onsubmit=async e=>{
    e.preventDefault();showErr(m,'');
    const meta=readMeta(new FormData(f));if(!meta.title)return showErr(m,'Please add a title.');
    let rec;
    if(existing)rec={...existing,...meta,updatedAt:Date.now()};
    else{
      const file=f.file.files[0];if(!file)return showErr(m,'Choose a PDF file.');
      if(!await isPdf(file))return showErr(m,'That file is not a valid PDF.');
      rec={id:uid(),...meta,file,fileName:file.name,size:file.size,createdAt:Date.now()};
    }
    const b=$('#fsub',m.el);b.disabled=true;b.textContent='Saving…';
    try{await DB.put('notes',rec)}catch(ex){b.disabled=false;b.textContent=existing?'Save changes':'Publish note';return showErr(m,storageMsg(ex))}
    m.close();toast(existing?'Note updated.':'Note published.');go(existing?S.route:'#/notes');
  };
}

async function editMeta(t,it){
  const subs=await subjectList();
  const m=openModal('Edit '+LABEL[t].toLowerCase(),`<form class="form" id="ef">${metaFields(it,subs)}${formFoot('Save changes')}</form>`,{wide:true});
  $('#ef',m.el).onsubmit=async e=>{
    e.preventDefault();const meta=readMeta(new FormData(e.target));if(!meta.title)return showErr(m,'Please add a title.');
    try{await DB.put(t,{...it,...meta,updatedAt:Date.now()})}catch(ex){return showErr(m,storageMsg(ex))}
    m.close();toast('Saved.');render();
  };
}

async function postForm(existing){
  const m=openModal(existing?'Edit post':'New post',`<form class="form" id="pf"><label>Title (optional)<input name="title" maxlength="140" value="${esc(existing&&existing.title)}"></label><label>What would you like to share?<textarea name="body" rows="6" required maxlength="5000">${esc(existing&&existing.body)}</textarea></label>${formFoot(existing?'Save changes':'Publish')}</form>`);
  $('#pf',m.el).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);const body=fd.get('body').trim();if(!body)return showErr(m,'Write something to share.');
    const rec=existing?{...existing,title:fd.get('title').trim(),body,updatedAt:Date.now()}:{id:uid(),title:fd.get('title').trim(),body,createdAt:Date.now()};
    try{await DB.put('posts',rec)}catch(ex){return showErr(m,storageMsg(ex))}
    m.close();toast(existing?'Post updated.':'Post published.');go(existing?S.route:'#/');
  };
}

/* ---- Video: record / upload ---- */
const permMsg=ex=>{
  const n=ex&&ex.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'Camera or microphone access was blocked. Allow access in your browser\'s site settings, or upload a video file instead.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'No camera or microphone was found on this device.';
  if(n==='NotReadableError')return 'Your camera or microphone is being used by another app.';
  return 'Could not start the camera: '+((ex&&ex.message)||'unknown error');
};
async function videoForm(){
  const subs=await subjectList();
  let stream=null,rec=null,chunks=[],blob=null,url=null,timer=null,startedAt=0,acc=0,state='idle',source='rec',closed=false,fileName='';
  const m=openModal('Share a video',`
  <div class="tabs" style="margin-top:0"><button type="button" class="tab on" data-tab="rec">Record</button><button type="button" class="tab" data-tab="up">Upload</button></div>
  <div class="vbox"><video id="vp" playsinline></video><div class="vph" id="vph">Record with your camera and microphone, or upload a video from your device.</div></div>
  <div class="row" id="prec" style="margin-bottom:8px">
    <button type="button" class="btn ghost" id="b-cam">${ic('video',16)} Turn on camera</button>
    <button type="button" class="btn" id="b-start" hidden>${ic('rec',16,true)} Start recording</button>
    <button type="button" class="btn ghost" id="b-pause" hidden></button>
    <button type="button" class="btn ghost" id="b-stop" hidden>${ic('stop',16,true)} Stop</button>
    <button type="button" class="btn ghost" id="b-redo" hidden>Record again</button>
    <span id="timer" hidden>00:00</span>
  </div>
  <div id="pup" hidden style="margin-bottom:8px"><input type="file" id="vfile" accept="video/*,.mp4,.webm,.mov,.m4v,.ogv" aria-label="Choose a video file"></div>
  <p class="sub" id="vinfo" style="min-height:22px"></p>
  <form class="form" id="vf">${metaFields({},subs)}${formFoot('Publish video').replace('id="fsub"','id="fsub" disabled')}</form>`,{wide:true,sticky:true,onClose:cleanup});
  const $m=s=>$(s,m.el);
  const vp=$m('#vp');
  const show=(s,on)=>{$m(s).hidden=!on};
  const info=(t,bad)=>{const e=$m('#vinfo');e.textContent=t||'';e.style.color=bad?'var(--danger)':''};
  function ui(s){
    state=s;
    show('#b-cam',s==='idle'&&source==='rec');show('#b-start',s==='live');
    show('#b-pause',s==='recording'||s==='paused');show('#b-stop',s==='recording'||s==='paused');
    show('#b-redo',s==='done'&&source==='rec');show('#timer',s==='recording'||s==='paused');
    show('#vph',s==='idle'&&!blob);
    $m('#b-pause').innerHTML=s==='paused'?ic('play',16,true)+' Resume':ic('pause',16)+' Pause';
  }
  function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
  function clearBlob(){if(url)URL.revokeObjectURL(url);url=null;blob=null;vp.onerror=null;vp.removeAttribute('src');vp.srcObject=null;vp.load();$m('#fsub').disabled=true;info('')}
  function setBlob(b,name){
    clearBlob();blob=b;fileName=name||'';url=URL.createObjectURL(b);
    vp.srcObject=null;vp.muted=false;vp.controls=true;
    vp.onerror=()=>{info('Your browser cannot play this video format. Try an MP4 or WebM file.',true);blob=null;$m('#fsub').disabled=true};
    vp.src=url;$m('#fsub').disabled=false;
    info(`Ready to publish · ${fmtSize(b.size)}`);ui('done');
  }
  function cleanup(){
    closed=true;clearInterval(timer);
    try{if(rec&&rec.state!=='inactive')rec.stop()}catch(e){}
    stopStream();if(url)URL.revokeObjectURL(url);
  }
  const tick=()=>{const s=Math.floor((acc+(state==='recording'?Date.now()-startedAt:0))/1000);$m('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  $m('#b-cam').onclick=async()=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){info('Recording is not supported in this browser. You can upload a video file instead.',true);return}
    info('Waiting for camera permission…');
    try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(ex){info(permMsg(ex),true);return}
    if(closed){stopStream();return}
    vp.srcObject=stream;vp.muted=true;vp.controls=false;vp.play().catch(()=>{});info('Camera is on. Press Start recording when ready.');ui('live');
  };
  $m('#b-start').onclick=()=>{
    chunks=[];
    const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    try{rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(ex){info('This browser could not start recording: '+ex.message,true);return}
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{
      clearInterval(timer);if(closed)return;
      const type=rec.mimeType||mt||'video/webm';stopStream();
      if(!chunks.length){info('Nothing was recorded. Please try again.',true);ui('idle');return}
      setBlob(new Blob(chunks,{type}),'Recording');
    };
    rec.onerror=()=>info('Recording stopped because of an error.',true);
    acc=0;startedAt=Date.now();rec.start(1000);ui('recording');info('Recording…');
    clearInterval(timer);timer=setInterval(tick,250);tick();
  };
  $m('#b-pause').onclick=()=>{
    if(state==='recording'){if(typeof rec.pause!=='function')return;rec.pause();acc+=Date.now()-startedAt;ui('paused');info('Paused.')}
    else if(state==='paused'){rec.resume();startedAt=Date.now();ui('recording');info('Recording…')}
  };
  $m('#b-stop').onclick=()=>{if(state==='paused')acc+=0;rec.stop()};
  $m('#b-redo').onclick=()=>{clearBlob();ui('idle')};
  $$('[data-tab]',m.el).forEach(tb=>tb.onclick=()=>{
    if(state==='recording'||state==='paused')return toast('Stop recording first.');
    const to=tb.dataset.tab;if(to===source)return;
    source=to;stopStream();clearBlob();
    $$('[data-tab]',m.el).forEach(x=>x.classList.toggle('on',x===tb));
    show('#prec',to==='rec');show('#pup',to==='up');$m('#vfile').value='';ui('idle');
    $m('#vph').textContent=to==='rec'?'Record with your camera and microphone, or upload a video from your device.':'Choose a video file from your device to preview it here.';
  });
  $m('#vfile').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const ok=(file.type||'').startsWith('video/')||/\.(mp4|webm|mov|m4v|ogv|mkv)$/i.test(file.name);
    if(!ok){clearBlob();e.target.value='';ui('idle');info('That is not a supported video file.',true);return}
    setBlob(file,file.name);
    const f=$m('#vf');if(!f.title.value)f.title.value=file.name.replace(/\.[^.]+$/,'');
  };
  ui('idle');
  $m('#vf').onsubmit=async e=>{
    e.preventDefault();showErr(m,'');
    if(!blob)return showErr(m,'Record or choose a video first.');
    const meta=readMeta(new FormData(e.target));if(!meta.title)return showErr(m,'Please add a title.');
    const b=$m('#fsub');b.disabled=true;b.textContent='Saving to your browser…';
    const recd={id:uid(),...meta,file:blob,mime:blob.type||'',fileName,size:blob.size,createdAt:Date.now()};
    try{await DB.put('videos',recd)}catch(ex){b.disabled=false;b.textContent='Publish video';return showErr(m,storageMsg(ex))}
    m.close();toast('Video published.');go('#/videos');
  };
}

/* ---- Quiz builder ---- */
const blankQ=()=>({q:'',options:['',''],correct:-1});
/* ---------- Quiz from a PDF: plain rules, no AI. Fill-in-the-blank questions built from the PDF's own text. ---------- */
const QSTOP=new Set('about above after again against also among another because been before being below between both cannot could does doing down during each either else even ever every from further have having here however into itself just like made make many more most much must never only other over please same shall should since some such than that their them then there these they this those through under until upon very were what when where whether which while whom will with within without would your you yours can may might used using use one two three first second'.split(' '));
async function pdfText(blob){
  if(!window.pdfjsLib)throw new Error('lib');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  const out=[],n=Math.min(pdf.numPages,40);
  for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out.push(tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join(''))}
  try{pdf.destroy()}catch(e){}
  return out.join('\n');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestions(raw,want){
  const text=raw.replace(/-\s*\n\s*/g,'').replace(/\s+/g,' ').trim();
  const sents=(text.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[]).map(x=>x.trim());
  const TOK=/\d+(?:\.\d+)?|[A-Za-z][A-Za-z'-]{3,17}/g;
  const freq=new Map(),caps=new Map();
  for(const s of sents){
    let m;TOK.lastIndex=0;
    while((m=TOK.exec(s))){
      const w=m[0],lw=w.toLowerCase();
      if(/^\d/.test(w)&&w.length>6)continue;
      freq.set(lw,(freq.get(lw)||0)+1);
      if(m.index>0&&/^[A-Z]/.test(w))caps.set(lw,(caps.get(lw)||0)+1);
    }
  }
  const isCap=lw=>(caps.get(lw)||0)/(freq.get(lw)||1)>=0.6;
  const cands=[];
  sents.forEach((s,idx)=>{
    if(s.length<45||s.length>230)return;
    const wc=s.split(' ').length;if(wc<8||wc>34)return;
    if(/https?:|www\.|@|\.{3,}/.test(s))return;
    if((s.match(/[A-Za-z]/g)||[]).length/s.length<0.7)return;
    if((s.match(/[A-Z]/g)||[]).length>s.length*0.3)return;
    let best=null,m;TOK.lastIndex=0;
    while((m=TOK.exec(s))){
      const w=m[0],lw=w.toLowerCase(),num=/^\d/.test(w);
      if(m.index<8||QSTOP.has(lw)||(num&&w.length>6)||(!num&&lw.length<5))continue;
      const f=freq.get(lw)||0,cap=!num&&isCap(lw);
      if(!(f>=2||num||cap))continue;
      const score=(num?3:0)+(cap?3:0)+Math.min(f,6)+(lw.length>=8?1:0);
      if(!best||score>best.score)best={w,lw,num,cap,score};
    }
    if(best)cands.push({s,idx,...best});
  });
  const vocab=[...freq.keys()];
  const distract=c=>{
    const sl=c.s.toLowerCase();let pool;
    if(c.num)pool=vocab.filter(v=>/^\d/.test(v)&&v!==c.lw&&!sl.includes(v));
    else{
      pool=vocab.filter(v=>!/^\d/.test(v)&&v!==c.lw&&!QSTOP.has(v)&&v.length>=5&&Math.abs(v.length-c.lw.length)<=4&&isCap(v)===c.cap&&!sl.includes(v)&&(freq.get(v)>=2||c.cap));
      pool.sort((a,b)=>freq.get(b)-freq.get(a));pool=pool.slice(0,40);
    }
    return pool.length<3?null:shuffle(pool).slice(0,3);
  };
  const used=new Set(),chosen=[];
  const take=c=>{if(used.has(c.lw))return false;const d=distract(c);if(!d)return false;used.add(c.lw);chosen.push({c,d});return true};
  const size=Math.max(1,Math.ceil(cands.length/want));
  for(let i=0;i<cands.length&&chosen.length<want;i+=size){
    for(const c of cands.slice(i,i+size).sort((a,b)=>b.score-a.score))if(take(c))break;
  }
  [...cands].sort((a,b)=>b.score-a.score).forEach(c=>{if(chosen.length<want)take(c)});
  chosen.sort((a,b)=>a.c.idx-b.c.idx);
  return chosen.map(({c,d})=>{
    const up=/^[A-Z]/.test(c.w),fmt=v=>/^\d/.test(v)?v:(up?v[0].toUpperCase()+v.slice(1):v);
    const opts=shuffle([c.w,...d.map(fmt)]);
    const stem=c.s.replace(new RegExp('\\b'+c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'),'_____');
    return {q:'Fill in the blank: '+stem,options:opts,correct:opts.indexOf(c.w)};
  });
}

async function quizForm(existing){
  const subs=await subjectList();
  let qs=existing?JSON.parse(JSON.stringify(existing.questions)):[blankQ()];
  const notes=existing?[]:(await DB.all('notes')).sort((a,b)=>b.createdAt-a.createdAt);
  const m=openModal(existing?'Edit quiz':'Create a quiz',`<form class="form" id="qf">
  <label>Title<input name="title" required maxlength="140" value="${esc(existing&&existing.title)}"></label>
  <label>Description<textarea name="description" rows="2" maxlength="2000">${esc(existing&&existing.description)}</textarea></label>
  <label>Subject (optional)<input name="subject" list="dl-sub" maxlength="60" value="${esc(existing&&existing.subject)}"></label>
  <datalist id="dl-sub">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  ${existing?'':`<div class="genbox"><h3>Generate questions from a PDF</h3><p class="sub" style="margin-bottom:10px">Choose a PDF and Orbital builds fill-in-the-blank questions from its text. This is automatic and rule-based, so check every question before you publish.</p>
  <div class="grid2"><label>From your notes<select id="gsrc">${notes.length?'<option value="">Choose a note…</option>'+notes.map(n=>`<option value="${esc(n.id)}">${esc(n.title)}</option>`).join(''):'<option value="">No notes uploaded yet</option>'}</select></label><label>Or choose a PDF file<input type="file" id="gfile" accept="application/pdf,.pdf"></label></div>
  <div class="row"><label style="margin:0">Questions<select id="gn" style="width:auto"><option>5</option><option>8</option><option>10</option></select></label><button type="button" class="btn ghost" id="ggen">Generate questions</button></div>
  <p class="sub" id="ginfo" style="margin:8px 0 0" aria-live="polite"></p></div>`}
  <div id="qlist"></div>
  <button type="button" class="btn ghost" id="addq">${ic('plus',16)} Add question</button>
  <p class="sub" style="margin-top:10px">Select the round button next to the correct answer for each question.</p>
  ${formFoot(existing?'Save changes':'Publish quiz')}</form>`,{wide:true,sticky:true});
  const list=$('#qlist',m.el);
  const ggen=$('#ggen',m.el);
  if(ggen){
    const say=(t,bad)=>{const e=$('#ginfo',m.el);e.textContent=t;e.style.color=bad?'var(--danger)':''};
    ggen.onclick=async()=>{
      let blob=null,label='',note=null;const f=$('#gfile',m.el).files[0];
      if(f){if(!await isPdf(f))return say('That file is not a valid PDF.',true);blob=f;label=f.name.replace(/\.pdf$/i,'')}
      else{note=notes.find(x=>x.id===$('#gsrc',m.el).value);if(note){blob=note.file;label=note.title}}
      if(!blob)return say('Choose a note or a PDF file first.',true);
      ggen.disabled=true;say('Reading the PDF…');
      try{
        const raw=await pdfText(blob);
        if(raw.replace(/\s/g,'').length<200)return say('No readable text found. Scanned PDFs (pictures of pages) are not supported.',true);
        const gen=makeQuestions(raw,+$('#gn',m.el).value);
        if(!gen.length)return say('Could not build questions from this PDF because it has too little running text. Add questions by hand instead.',true);
        if(qs.length===1&&!qs[0].q.trim()&&qs[0].options.every(o=>!o.trim()))qs=[];
        qs.push(...gen);paint();
        const f2=$('#qf',m.el);
        if(!f2.title.value.trim())f2.title.value=('Quiz: '+label).slice(0,140);
        if(note&&note.subject&&!f2.subject.value.trim())f2.subject.value=note.subject;
        say(`Added ${gen.length} question${gen.length===1?'':'s'}. Check each one, fix anything that looks wrong, then publish.`);
        list.scrollIntoView({block:'start'});
      }catch(e){say(e&&e.message==='lib'?'The PDF reader could not load. Check your internet connection and try again.':'Could not read this PDF.',true)}
      finally{ggen.disabled=false}
    };
  }
  const paint=()=>{list.innerHTML=qs.map((q,i)=>`<fieldset class="qb"><legend>Question ${i+1}</legend>
    <input class="qt" data-qi="${i}" placeholder="Question text" aria-label="Question ${i+1}" value="${esc(q.q)}">
    ${q.options.map((o,j)=>`<div class="opt"><input type="radio" name="c${i}" data-ci="${i}" data-oj="${j}" ${q.correct===j?'checked':''} aria-label="Mark option ${j+1} correct"><input class="ot" data-qi="${i}" data-oj="${j}" placeholder="Option ${j+1}" aria-label="Option ${j+1}" value="${esc(o)}">${q.options.length>2?`<button type="button" class="x2" data-rmo="${i}:${j}" aria-label="Remove option">×</button>`:''}</div>`).join('')}
    <div class="row" style="margin-top:10px">${q.options.length<6?`<button type="button" class="lnk" data-addo="${i}">+ Add option</button>`:''}${qs.length>1?`<button type="button" class="lnk danger" data-rmq="${i}">Remove question</button>`:''}</div></fieldset>`).join('')};
  paint();
  list.addEventListener('input',e=>{
    const t=e.target;
    if(t.classList.contains('qt'))qs[+t.dataset.qi].q=t.value;
    if(t.classList.contains('ot'))qs[+t.dataset.qi].options[+t.dataset.oj]=t.value;
  });
  list.addEventListener('change',e=>{const t=e.target;if(t.dataset.ci!==undefined)qs[+t.dataset.ci].correct=+t.dataset.oj});
  list.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.addo!==undefined){qs[+b.dataset.addo].options.push('')}
    else if(b.dataset.rmo){const [i,j]=b.dataset.rmo.split(':').map(Number);const q=qs[i];q.options.splice(j,1);if(q.correct===j)q.correct=-1;else if(q.correct>j)q.correct--}
    else if(b.dataset.rmq!==undefined){qs.splice(+b.dataset.rmq,1)}
    else return;
    paint();
  });
  $('#addq',m.el).onclick=()=>{qs.push(blankQ());paint();const f=$$('.qb',list).pop();if(f)f.scrollIntoView({block:'center'})};
  $('#qf',m.el).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);const title=fd.get('title').trim();
    if(!title)return showErr(m,'Please add a quiz title.');
    if(!qs.length)return showErr(m,'Add at least one question.');
    for(let i=0;i<qs.length;i++){
      const q=qs[i],n=i+1;
      if(!q.q.trim())return showErr(m,`Question ${n} needs text.`);
      if(q.options.length<2)return showErr(m,`Question ${n} needs at least two options.`);
      if(q.options.some(o=>!o.trim()))return showErr(m,`Question ${n} has an empty option. Fill it in or remove it.`);
      if(q.correct<0||q.correct>=q.options.length)return showErr(m,`Select the correct answer for question ${n}.`);
    }
    const questions=qs.map(q=>({q:q.q.trim(),options:q.options.map(o=>o.trim()),correct:q.correct}));
    const base={title,description:fd.get('description').trim(),subject:fd.get('subject').trim(),questions};
    const rec=existing?{...existing,...base,updatedAt:Date.now()}:{id:uid(),...base,createdAt:Date.now()};
    try{
      if(existing&&JSON.stringify(existing.questions)!==JSON.stringify(questions))
        for(const a of await DB.all('attempts'))if(a.quizId===existing.id)await DB.del('attempts',a.id);
      await DB.put('quizzes',rec);
    }catch(ex){return showErr(m,storageMsg(ex))}
    m.close();toast(existing?'Quiz updated.':'Quiz published.');go(existing?S.route:'#/quizzes');
  };
}

function editItem(t,it){
  if(t==='notes'||t==='videos')return editMeta(t,it);
  if(t==='quizzes')return quizForm(it);
  if(t==='posts')return postForm(it);
}

function createMenu(){

/* ---------- In-site video call: WebRTC mesh, signalled through the database ---------- */
const RTC_CFG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function liveCallUI(tok,id){
  const box=$('#rlive');if(!box)return;
  const pid=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
  const name=((S.me&&S.me.name)||getNick()||'Guest').slice(0,40);
  let stream=null,pcs={},unsubs=[],hb=null,joined=false,mic=true,cam=true,dbc=null;
  const idle=msg=>{
    box.innerHTML=`<p class="sub" style="margin-bottom:10px">Video or voice, without leaving Orbital. Your browser will ask for camera and microphone access (microphone only for voice calls).</p><div class="row"><button class="btn" id="lstart">${ic('video',16)} Join video call</button><button class="btn ghost" id="lvoice">${ic('phone',16)} Join voice call</button></div>${msg?`<p class="fine" style="margin-top:8px">${msg}</p>`:''}`;
    $('#lstart').onclick=()=>start(false);$('#lvoice').onclick=()=>start(true);
  };
  function addTile(k,label,ms,me){
    const g=$('#vgrid');if(!g)return;let t=$('[data-k="'+k+'"]',g);
    if(!t){t=document.createElement('div');t.className='vtile';t.dataset.k=k;t.innerHTML='<video autoplay playsinline></video><span class="vname"></span>';g.appendChild(t)}
    const v=$('video',t);v.muted=!!me;v.srcObject=ms;$('.vname',t).textContent=label;
    t.dataset.i=(label.trim()[0]||'?').toUpperCase();t.classList.toggle('aud',!ms.getVideoTracks().length);
    if(v.play)v.play().catch(()=>{});
  }
  function dropPeer(k){
    const p=pcs[k];if(p){try{p.pc.close()}catch(e){}delete pcs[k]}
    const t=$('[data-k="'+k+'"]');if(t)t.remove();
  }
  const gathered=pc=>new Promise(r=>{
    if(pc.iceGatheringState==='complete')return r();
    const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};
    pc.addEventListener('icegatheringstatechange',f);setTimeout(r,4000);
  });
  function mk(peerId,peerName){
    const pc=new RTCPeerConnection(RTC_CFG);pcs[peerId]={pc};
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.ontrack=e=>{if(e.streams[0])addTile(peerId,peerName,e.streams[0])};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')dropPeer(peerId)};
    return pc;
  }
  const desc=d=>d&&typeof d.sdp==='string'&&(d.type==='offer'||d.type==='answer')?{type:d.type,sdp:d.sdp}:null;
  async function offerPeer(sig,peerId,peerName){
    try{
      const pc=mk(peerId,peerName);
      await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
      await sig.doc(pid+'_'+peerId).set({from:pid,to:peerId,name,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},at:Date.now()});
    }catch(e){dropPeer(peerId)}
  }
  async function answerPeer(sig,docId,d){
    const off=desc(d.offer);if(!off)return;
    try{
      const pc=mk(d.from,String(d.name||'Guest').slice(0,40));
      await pc.setRemoteDescription(off);
      await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
      await sig.doc(docId).update({answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
    }catch(e){dropPeer(d.from)}
  }
  function join(){
    joined=true;const t0=Date.now();
    const base=dbc.doc('rooms/'+id),mem=base.collection('members'),sig=base.collection('sig');
    box.innerHTML=`<div class="vgrid" id="vgrid"></div><div class="row"><button class="btn ghost" id="lmic">${mic?'Mute mic':'Unmute mic'}</button><button class="btn ghost" id="lcam" ${stream.getVideoTracks().length?'':'disabled'}>Turn camera off</button><button class="btn" id="lleave">Leave call</button></div><p class="fine" style="margin-top:8px">People in the room who join the video call appear here. Up to 5 people work best.</p>`;
    addTile('me',name+' (you)',stream,true);
    $('#lmic').onclick=e=>{mic=!mic;stream.getAudioTracks().forEach(t=>t.enabled=mic);e.target.textContent=mic?'Mute mic':'Unmute mic'};
    $('#lcam').onclick=e=>{cam=!cam;stream.getVideoTracks().forEach(t=>t.enabled=cam);e.target.textContent=cam?'Turn camera off':'Turn camera on'};
    $('#lleave').onclick=async()=>{await stop();idle()};
    mem.doc(pid).set({name,at:t0,joined:t0}).catch(()=>toast('Could not join the call. You may need Contributor access to this page.'));
    hb=setInterval(()=>mem.doc(pid).update({at:Date.now()}).catch(()=>{}),10000);
    unsubs.push(sig.where('to','==',pid).onSnapshot(sn=>sn.docChanges().forEach(ch=>{
      if(ch.type==='removed')return;const d=ch.doc.data();
      if(d&&d.offer&&!d.answer&&typeof d.from==='string'&&!pcs[d.from]&&Date.now()-d.at<120000)answerPeer(sig,ch.doc.id,d);
    })));
    unsubs.push(sig.where('from','==',pid).onSnapshot(sn=>sn.docChanges().forEach(ch=>{
      const d=ch.doc.data(),p=d&&pcs[d.to],a=d&&desc(d.answer);
      if(p&&a&&!p.pc.currentRemoteDescription)p.pc.setRemoteDescription(a).catch(()=>{});
    })));
    unsubs.push(mem.onSnapshot(sn=>{
      sn.docs.forEach(m=>{
        const d=m.data();
        if(m.id===pid||!d||pcs[m.id]||Date.now()-d.at>30000||!(d.joined<t0))return;
        offerPeer(sig,m.id,String(d.name||'Guest').slice(0,40));
      });
      sn.docChanges().forEach(ch=>{if(ch.type==='removed')dropPeer(ch.doc.id)});
    }));
  }
  async function start(audioOnly){
    $$('#lstart,#lvoice').forEach(b=>{b.disabled=true});
    dbc=await getDbCap();
    if(!dbc)return idle('Live video needs the published Orbital page and a signed-in account.');
    try{const P=await claude.use('permissions');if(P)await P.request()}catch(e){}
    const md=navigator.mediaDevices;
    if(!md||!md.getUserMedia||!window.RTCPeerConnection)return idle('This browser or page does not support live video. Use the call link below instead.');
    try{stream=await md.getUserMedia({video:audioOnly?false:{width:{ideal:640},height:{ideal:480}},audio:{echoCancellation:true,noiseSuppression:true}});if(audioOnly)cam=false}
    catch(e){try{stream=await md.getUserMedia({audio:true});cam=false}catch(e2){return idle('Camera or microphone access was blocked. Allow it in your browser\u2019s site settings and try again. If it is blocked by the page itself, use the call link below.')}}
    if(tok!==S.tok){stream.getTracks().forEach(t=>t.stop());return}
    join();
  }
  async function stop(){
    clearInterval(hb);unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
    Object.keys(pcs).forEach(dropPeer);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    if(joined&&dbc){
      joined=false;const base=dbc.doc('rooms/'+id),sig=base.collection('sig');
      base.collection('members').doc(pid).delete().catch(()=>{});
      ['from','to'].forEach(f=>sig.where(f,'==',pid).get().then(sn=>sn.docs.forEach(d=>sig.doc(d.id).delete().catch(()=>{}))).catch(()=>{}));
    }
  }
  const bye=()=>{stop()};
  window.addEventListener('pagehide',bye);
  S.cleanups.push(()=>{window.removeEventListener('pagehide',bye);stop()});
  idle();
}

async function loadJsQR(){
  if(window.jsQR)return window.jsQR;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  return window.jsQR;
}
async function decode(src,w,h){
  if('BarcodeDetector' in window){
    try{detector=detector||new BarcodeDetector();const r=await detector.detect(src);if(r.length)return r[0].rawValue}catch(e){}
  }
  try{
    const q=await loadJsQR();const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
    const r=q(x.getImageData(0,0,w,h).data,w,h);return r?r.data:null;
  }catch(e){return null}
}
function stopScan(){
  scanning=false;clearTimeout(tmr);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=$("#scanvid");if(v){v.srcObject=null;v.hidden=true}
  const b=$("#scango");if(b)b.textContent="Start camera";
}
async function startScan(){
  const md=navigator.mediaDevices,msg=$("#scanmsg");
  if(!md||!md.getUserMedia){msg.textContent="Camera scanning is not available here. Use Scan from photo or type the code.";return}
  try{stream=await md.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
  catch(e){msg.textContent="Camera access was blocked. Allow it in your browser settings, or use Scan from photo or type the code.";return}
  const v=$("#scanvid");v.srcObject=stream;v.hidden=false;await v.play().catch(()=>{});
  $("#scango").textContent="Stop camera";scanning=true;msg.textContent="Point the camera at the book's QR code or barcode.";
  const tick=async()=>{
    if(!scanning)return;
    if(v.videoWidth){
      const w=Math.min(v.videoWidth,640),h=Math.round(v.videoHeight*w/v.videoWidth);
      const val=await decode(v,w,h);
      if(val&&scanning){stopScan();msg.textContent="Scanned.";showResult(val);return}
    }
    tmr=setTimeout(tick,250);
  };
  tick();
}
function wireScan(){
  $("#scango").onclick=()=>stream?stopScan():startScan();
  $("#scanfile").onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;const msg=$("#scanmsg");msg.textContent="Reading the photo…";
    try{

      const val=await decode(bm,Math.round(bm.width*sc),Math.round(bm.height*sc));
      if(val){msg.textContent="Scanned.";showResult(val)}else msg.textContent="No code found in that photo. Try a closer, sharper picture.";
    }catch(err){msg.textContent="Could not read that image."}

}
